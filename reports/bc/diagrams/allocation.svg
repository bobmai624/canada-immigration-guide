<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">图 3  配额如何读：总额、地域方向与专项上限</title><desc id="desc">6254年度提名分配，至少35%大温以外为预期；最多250名专项不能叠加为额外配额。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55776e" stroke-width="1.5"/></marker></defs><rect width="1100" height="420" fill="#fff"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#193e37"><text x="40" y="44" font-size="25" font-weight="700">图 3  配额如何读：总额、地域方向与专项上限</text><text x="40" y="88" font-size="15" fill="#62756d">2026 提名分配：最初 5,254 + 8 月追加 1,000 = 6,254；不是当前剩余名额。</text><rect x="40" y="110" width="840" height="62" rx="8" fill="#1f6957"/><rect x="880" y="110" width="160" height="62" rx="8" fill="#d5b874"/><text x="400" y="149" font-size="22" fill="white">5,254 初始分配</text><text x="899" y="147" font-size="19">+1,000</text><rect x="40" y="220" width="490" height="115" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="285.0" y="257.5" text-anchor="middle" font-size="19" font-weight="700">≥35% 为省府预期</text><text x="285.0" y="283.5" text-anchor="middle" font-size="16" font-weight="400">2026 提名预计至少 35%</text><text x="285.0" y="309.5" text-anchor="middle" font-size="16" font-weight="400">对应大温以外工作的申请人</text><rect x="570" y="220" width="470" height="115" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="805.0" y="257.5" text-anchor="middle" font-size="19" font-weight="700">≤250 为专项人数上限</text><text x="805.0" y="283.5" text-anchor="middle" font-size="16" font-weight="400">农村 / 偏远卫生支持一次性专项</text><text x="805.0" y="309.5" text-anchor="middle" font-size="16" font-weight="400">属于总分配中的安排，不再相加</text><text x="40" y="380" font-size="15" fill="#62756d">没有官方 Care / Build / Innovate 固定百分比：不画虚构饼图，也不把上限当剩余额度。</text></g></svg>