<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">图 5  工作许可与永久居民申请分开走</title><desc id="desc">四种起点是备选身份状态，不是必须逐项通过的流程。每条都要单独核联邦工作授权。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55776e" stroke-width="1.5" /></marker></defs><rect width="1100" height="700" fill="#fff" /><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#193e37"><text x="40" y="44" font-size="25" font-weight="700">图 5  工作许可与永久居民申请分开走</text><rect x="40" y="85" width="250" height="108" rx="12" fill="#edf3fc" stroke="#a4b8d4" /><path d="M290 139 L330 139" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)" /><rect x="330" y="85" width="710" height="108" rx="12" fill="#ecf5ee" stroke="#a0bcaa" /><rect x="40" y="230" width="250" height="108" rx="12" fill="#edf3fc" stroke="#a4b8d4" /><path d="M290 284 L330 284" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)" /><rect x="330" y="230" width="710" height="108" rx="12" fill="#ecf5ee" stroke="#a0bcaa" /><rect x="40" y="375" width="250" height="108" rx="12" fill="#edf3fc" stroke="#a4b8d4" /><path d="M290 429 L330 429" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)" /><rect x="330" y="375" width="710" height="108" rx="12" fill="#ecf5ee" stroke="#a0bcaa" /><rect x="40" y="520" width="250" height="108" rx="12" fill="#edf3fc" stroke="#a4b8d4" /><path d="M290 574 L330 574" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)" /><rect x="330" y="520" width="710" height="108" rx="12" fill="#ecf5ee" stroke="#a0bcaa" /><text x="165.0" y="144.95" text-anchor="middle" font-size="17" font-weight="600">没有现成工作权</text><text x="685.0" y="120.95" text-anchor="middle" font-size="17" font-weight="600">真实雇主 → 劳动力市场影响评估 或具体豁免依据 → 加拿大移民、难民及公民部 工签批</text><text x="685.0" y="144.95" text-anchor="middle" font-size="17" font-weight="400">准 → 按条件工作</text><text x="685.0" y="168.95" text-anchor="middle" font-size="17" font-weight="400">不能用 offer、注册或省提名申请回执代替工签</text><text x="165.0" y="265.95" text-anchor="middle" font-size="17" font-weight="600">已持 毕业后工作许可证 / 合</text><text x="165.0" y="289.95" text-anchor="middle" font-size="17" font-weight="400">格开放工</text><text x="165.0" y="313.95" text-anchor="middle" font-size="17" font-weight="400">签</text><text x="685.0" y="265.95" text-anchor="middle" font-size="17" font-weight="600">核工签有效期与限制 → 合规就业 → 不列颠哥伦比亚省 注册 / 申请 → 提名前继续维</text><text x="685.0" y="289.95" text-anchor="middle" font-size="17" font-weight="400">持身份</text><text x="685.0" y="313.95" text-anchor="middle" font-size="17" font-weight="400">等待邀请没有自动延签；身份恢复申请不等于恢复工作权</text><text x="165.0" y="422.95" text-anchor="middle" font-size="17" font-weight="600">已经取得 不列颠哥伦比亚省 </text><text x="165.0" y="446.95" text-anchor="middle" font-size="17" font-weight="400">提名</text><text x="685.0" y="399.7" text-anchor="middle" font-size="17" font-weight="600">满足条件获省府支持信 → 雇主 Portal / 合规费 → 向 加拿大移民、难民及公民部 申</text><text x="685.0" y="423.2" text-anchor="middle" font-size="17" font-weight="400">请雇主限定</text><text x="685.0" y="446.7" text-anchor="middle" font-size="17" font-weight="400">工签</text><text x="685.0" y="470.2" text-anchor="middle" font-size="17" font-weight="400">支持信是申请依据，最终工签由联邦决定</text><text x="165.0" y="579.95" text-anchor="middle" font-size="17" font-weight="600">已递交联邦永居</text><text x="685.0" y="567.95" text-anchor="middle" font-size="17" font-weight="600">分别核 过渡性开放工作许可证 资格、收件确认、类别审查阶段、提名就业限制与当前身份</text><text x="685.0" y="591.95" text-anchor="middle" font-size="17" font-weight="400">不能把所有提名人的永居回执都当作开放桥梁工签资格</text></g></svg>