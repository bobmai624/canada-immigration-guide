<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc"><title id="title">图 1  BC PNP 两大类别与联邦衔接</title><desc id="desc">技能与企业家两大类。技能分技术工人、卫生局和一次性临时卫生支持专项；企业家分三个分支。各自经提名后进入联邦审批。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55776e" stroke-width="1.5"/></marker></defs><rect width="1100" height="920" fill="#fff"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#193e37"><text x="40" y="44" font-size="25" font-weight="700">图 1  BC PNP 两大类别与联邦衔接</text><rect x="360" y="75" width="380" height="75" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="550.0" y="105.5" text-anchor="middle" font-size="19" font-weight="700">不列颠哥伦比亚省提名 BC PNP</text><text x="550.0" y="131.5" text-anchor="middle" font-size="16" font-weight="400">两大政策入口；选择适用类别</text><path d="M460 150 L285 200" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 150 L825 200" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="200" width="500" height="80" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="290.0" y="233.0" text-anchor="middle" font-size="19" font-weight="700">Skills Immigration 技能移民</text><text x="290.0" y="259.0" text-anchor="middle" font-size="16" font-weight="400">按职位、经验、雇主与职业资格申请</text><rect x="590" y="200" width="470" height="80" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="825.0" y="233.0" text-anchor="middle" font-size="19" font-weight="700">Entrepreneur Immigration 企业家移民</text><text x="825.0" y="259.0" text-anchor="middle" font-size="16" font-weight="400">按资产、经验、投资、经营和创造就业申请</text><path d="M285 280 L115 335" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M285 280 L285 335" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M285 280 L465 335" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="335" width="150" height="130" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="115.0" y="367.0" text-anchor="middle" font-size="19" font-weight="700">Skilled</text><text x="115.0" y="393.0" text-anchor="middle" font-size="16" font-weight="400">Worker</text><text x="115.0" y="419.0" text-anchor="middle" font-size="16" font-weight="400">技术工人</text><text x="115.0" y="445.0" text-anchor="middle" font-size="16" font-weight="400">注册 → 获邀</text><rect x="210" y="335" width="150" height="130" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="285.0" y="367.0" text-anchor="middle" font-size="19" font-weight="700">Health</text><text x="285.0" y="393.0" text-anchor="middle" font-size="16" font-weight="400">Authority</text><text x="285.0" y="419.0" text-anchor="middle" font-size="16" font-weight="400">卫生局</text><text x="285.0" y="445.0" text-anchor="middle" font-size="16" font-weight="400">合格者直接申请</text><rect x="390" y="335" width="150" height="130" rx="12" fill="#f2f3f2" stroke="#bcc4bf"/><text x="465.0" y="362.8" text-anchor="middle" font-size="19" font-weight="700">临时卫生专项</text><text x="465.0" y="384.40000000000003" text-anchor="middle" font-size="16" font-weight="400">农村 / 偏远</text><text x="465.0" y="406.0" text-anchor="middle" font-size="16" font-weight="400">卫生局现有雇员</text><text x="465.0" y="427.6" text-anchor="middle" font-size="16" font-weight="400">清洁 / 保安</text><text x="465.0" y="449.20000000000005" text-anchor="middle" font-size="16" font-weight="400">注册 → 获邀</text><rect x="590" y="335" width="145" height="130" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="662.5" y="380.0" text-anchor="middle" font-size="19" font-weight="700">Base</text><text x="662.5" y="406.0" text-anchor="middle" font-size="16" font-weight="400">基础类</text><text x="662.5" y="432.0" text-anchor="middle" font-size="16" font-weight="400">新建 / 收购</text><rect x="755" y="335" width="145" height="130" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="827.5" y="380.0" text-anchor="middle" font-size="19" font-weight="700">Regional</text><text x="827.5" y="406.0" text-anchor="middle" font-size="16" font-weight="400">区域类</text><text x="827.5" y="432.0" text-anchor="middle" font-size="16" font-weight="400">社区推荐</text><rect x="920" y="335" width="140" height="130" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="990.0" y="380.0" text-anchor="middle" font-size="19" font-weight="700">Strategic</text><text x="990.0" y="406.0" text-anchor="middle" font-size="16" font-weight="400">Projects</text><text x="990.0" y="432.0" text-anchor="middle" font-size="16" font-weight="400">企业扩张</text><path d="M825 280 L662 335" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M662 465 L825 535" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 280 L827 335" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M827 465 L825 535" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 280 L990 335" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M990 465 L825 535" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="535" width="470" height="135" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="825.0" y="582.5" text-anchor="middle" font-size="19" font-weight="700">获省支持 → 申请工签 → 实际经营</text><text x="825.0" y="608.5" text-anchor="middle" font-size="16" font-weight="400">分别满足投资、岗位、居住和履约协议</text><text x="825.0" y="634.5" text-anchor="middle" font-size="16" font-weight="400">再接受省提名审查；不是投资直接换 PR</text><path d="M115 465 L200 535" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M285 465 L200 535" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M465 465 L465 535" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="535" width="320" height="135" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="200.0" y="569.5" text-anchor="middle" font-size="19" font-weight="700">SW / HA 选联邦衔接</text><text x="200.0" y="595.5" text-anchor="middle" font-size="16" font-weight="400">EEBC 或基础省提名</text><text x="200.0" y="621.5" text-anchor="middle" font-size="16" font-weight="400">EEBC 须先满足 FSW / FST / CEC</text><text x="200.0" y="647.5" text-anchor="middle" font-size="16" font-weight="400">省申请及提名另行审核</text><rect x="390" y="535" width="150" height="135" rx="12" fill="#f2f3f2" stroke="#bcc4bf"/><text x="465.0" y="582.5" text-anchor="middle" font-size="19" font-weight="700">临时专项</text><text x="465.0" y="608.5" text-anchor="middle" font-size="16" font-weight="400">基础省提名</text><text x="465.0" y="634.5" text-anchor="middle" font-size="16" font-weight="400">不适用 EEBC</text><path d="M200 670 L200 735" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M465 670 L465 735" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 670 L825 735" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="735" width="1020" height="100" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="550.0" y="778.0" text-anchor="middle" font-size="19" font-weight="700">取得省提名 → IRCC 独立审查永久居民申请</text><text x="550.0" y="804.0" text-anchor="middle" font-size="16" font-weight="400">提名不等于 PR 批准；不会自动产生或延长工作权</text><text x="40" y="885" font-size="15" fill="#62756d">图例：横向为备选类别；沿本类别箭头阅读。条件与期限分别见第三章和第六章。</text></g></svg>