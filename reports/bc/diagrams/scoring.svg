<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">图 4  注册评分的组成 SIRS</title><desc id="desc">200分构成为相关经验40、学历40、语言40、时薪55、地区25。评分不替代资格。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55776e" stroke-width="1.5"/></marker></defs><rect width="1100" height="420" fill="#fff"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#193e37"><text x="40" y="44" font-size="25" font-weight="700">图 4  注册评分的组成 SIRS</text><rect x="40" y="90" width="200" height="95" fill="#286958"/><text x="140.0" y="129" text-anchor="middle" font-size="17" fill="white">相关经验</text><text x="140.0" y="160" text-anchor="middle" font-size="24" fill="white">40</text><rect x="240" y="90" width="200" height="95" fill="#437e6d"/><text x="340.0" y="129" text-anchor="middle" font-size="17" fill="white">学历与指定资质</text><text x="340.0" y="160" text-anchor="middle" font-size="24" fill="white">40</text><rect x="440" y="90" width="200" height="95" fill="#447764"/><text x="540.0" y="129" text-anchor="middle" font-size="17" fill="white">英 / 法语</text><text x="540.0" y="160" text-anchor="middle" font-size="24" fill="white">40</text><rect x="640" y="90" width="275" height="95" fill="#456d94"/><text x="777.5" y="129" text-anchor="middle" font-size="17" fill="white">职位时薪</text><text x="777.5" y="160" text-anchor="middle" font-size="24" fill="white">55</text><rect x="915" y="90" width="125" height="95" fill="#99731e"/><text x="977.5" y="129" text-anchor="middle" font-size="17" fill="white">工作地区</text><text x="977.5" y="160" text-anchor="middle" font-size="24" fill="white">25</text><text x="40" y="225" font-size="15" fill="#62756d">人力资本 120 分 + 经济因素 80 分 = 满分 200。资格门槛与注册得分分别判断。</text><rect x="40" y="265" width="490" height="110" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="285.0" y="300.0" text-anchor="middle" font-size="19" font-weight="700">先过资格门槛</text><text x="285.0" y="326.0" text-anchor="middle" font-size="16" font-weight="400">不合格的职位 / 雇主，不能靠加分补救</text><text x="285.0" y="352.0" text-anchor="middle" font-size="16" font-weight="400">博士、Co-op、语言与地区规则各有边界</text><rect x="570" y="265" width="470" height="110" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="805.0" y="300.0" text-anchor="middle" font-size="19" font-weight="700">再核本轮选择条件</text><text x="805.0" y="326.0" text-anchor="middle" font-size="16" font-weight="400">历史邀请分数不是未来保证线</text><text x="805.0" y="352.0" text-anchor="middle" font-size="16" font-weight="400">卫生局直接申请不依赖这套入池排名</text></g></svg>