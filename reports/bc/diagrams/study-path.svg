<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1070" role="img" aria-labelledby="title desc"><title id="title">图 2  境外客户 留学 → 就业 → BC 省提名</title><desc id="desc">先定职业再选校。完成学习获得工作权之后，分别判断技术工人邀请或卫生局直接申请；最后进入联邦审批。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55776e" stroke-width="1.5"/></marker></defs><rect width="1100" height="1070" fill="#fff"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#193e37"><text x="40" y="44" font-size="25" font-weight="700">图 2  境外客户 留学 → 就业 → BC 省提名</text><rect x="145" y="85" width="810" height="105" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="550.0" y="117.5" text-anchor="middle" font-size="19" font-weight="700">01  先选职业与通道</text><text x="550.0" y="143.5" text-anchor="middle" font-size="16" font-weight="400">NOC 主责 → 优先 / 排除名单 → 执照 → 雇主类型</text><text x="550.0" y="169.5" text-anchor="middle" font-size="16" font-weight="400">不要先按学校排名或学费选专业</text><path d="M550 190 L550 225" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="225" width="810" height="105" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="550.0" y="257.5" text-anchor="middle" font-size="19" font-weight="700">02  核学校与具体项目</text><text x="550.0" y="283.5" text-anchor="middle" font-size="16" font-weight="400">国际招生 + DLI + 项目 PGWP + CIP + 学制 + 入学与实习条件</text><text x="550.0" y="309.5" text-anchor="middle" font-size="16" font-weight="400">任何一项不满足，先换课程或停止留学方案</text><path d="M550 330 L550 365" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="365" width="810" height="105" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="550.0" y="397.5" text-anchor="middle" font-size="19" font-weight="700">03  完成学习并取得合法工作权</text><text x="550.0" y="423.5" text-anchor="middle" font-size="16" font-weight="400">合法学习 / 实习 → 毕业完成信 → 符合条件时申请 PGWP</text><text x="550.0" y="449.5" text-anchor="middle" font-size="16" font-weight="400">PGWP 通常只能获得一次；学签不是无限工作许可</text><path d="M550 470 L550 505" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="505" width="810" height="105" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="550.0" y="537.5" text-anchor="middle" font-size="19" font-weight="700">04  满足目标岗位和雇主条件</text><text x="550.0" y="563.5" text-anchor="middle" font-size="16" font-weight="400">真实 offer + 必要执照 + 雇主支持 + 工资 / 家庭收入</text><text x="550.0" y="589.5" text-anchor="middle" font-size="16" font-weight="400">SW 一般需近十年两年技术工作；不能抄萨省半年规则</text><path d="M550 610 L275 665" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 610 L825 665" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="665" width="465" height="100" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="277.5" y="695.0" text-anchor="middle" font-size="19" font-weight="700">Skilled Worker</text><text x="277.5" y="721.0" text-anchor="middle" font-size="16" font-weight="400">先注册 → 获邀 → 30 天内完整申请</text><text x="277.5" y="747.0" text-anchor="middle" font-size="16" font-weight="400">Care / Build / Innovate 是筛选重点</text><rect x="590" y="665" width="465" height="100" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="822.5" y="695.0" text-anchor="middle" font-size="19" font-weight="700">Health Authority</text><text x="822.5" y="721.0" text-anchor="middle" font-size="16" font-weight="400">合格卫生局支持 + 符合本类条件</text><text x="822.5" y="747.0" text-anchor="middle" font-size="16" font-weight="400">直接申请；私营护理岗位不能自动套用</text><path d="M275 765 L550 815" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 765 L550 815" fill="none" stroke="#55776e" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="815" width="810" height="90" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="550.0" y="853.0" text-anchor="middle" font-size="19" font-weight="700">省提名 → 按所选 EEBC / 非 EE 申请联邦永久居民</text><text x="550.0" y="879.0" text-anchor="middle" font-size="16" font-weight="400">等待期间另行维护工签、工作及提名条件</text><rect x="145" y="950" width="810" height="85" rx="12" fill="#fff0ee" stroke="#d9aaa4"/><text x="550.0" y="985.5" text-anchor="middle" font-size="19" font-weight="700">常见中断点</text><text x="550.0" y="1011.5" text-anchor="middle" font-size="16" font-weight="400">入学不等于 PGWP；毕业不等于就业；职业优先不等于获邀；提名不等于工签</text></g></svg>