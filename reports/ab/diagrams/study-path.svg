<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1012" viewBox="0 0 900 1012" role="img" aria-label="图4｜从选专业到省提名的逐关检查"><rect width="900" height="1012" fill="#f5f6f1"/><style>text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#203f38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}</style><text class="title" x="40" y="49">图4｜从选专业到省提名的逐关检查</text><rect x="40" y="80" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="114" r="17" fill="#186d55"/><text x="74" y="120" text-anchor="middle" style="fill:white;font-size:17px">1</text><text class="head" x="105" y="120">入学前：职业与资格</text><text class="body" x="105" y="152">先查真实岗位、职业代码和阿省执照，再选择课程。</text><path d="M450 192v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="212" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="246" r="17" fill="#186d55"/><text x="74" y="252" text-anchor="middle" style="fill:white;font-size:17px">2</text><text class="head" x="105" y="252">交定金前：学校与课程</text><text class="body" x="105" y="284">核对国际招生、学历类型、课程代码、毕业工签和省级学历要求。</text><path d="M450 324v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="344" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="378" r="17" fill="#186d55"/><text x="74" y="384" text-anchor="middle" style="fill:white;font-size:17px">3</text><text class="head" x="105" y="384">学习中：完成课程与合法实习</text><text class="body" x="105" y="416">语言入学分数、毕业工签语言和移民语言要求分别核。</text><path d="M450 456v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="476" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="510" r="17" fill="#186d55"/><text x="74" y="516" text-anchor="middle" style="fill:white;font-size:17px">4</text><text class="head" x="105" y="516">毕业后：工签＋匹配工作</text><text class="body" x="105" y="548">阿省机会类别的毕业工签持有人通常需相关工作至少6个月。</text><path d="M450 588v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="608" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="642" r="17" fill="#186d55"/><text x="74" y="648" text-anchor="middle" style="fill:white;font-size:17px">5</text><text class="head" x="105" y="648">满足类别后：意向表达与邀请</text><text class="body" x="105" y="680">邀请等待时间无法预先保证；留有身份及资金缓冲。</text><path d="M450 720v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="740" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="774" r="17" fill="#186d55"/><text x="74" y="780" text-anchor="middle" style="fill:white;font-size:17px">6</text><text class="head" x="105" y="780">提名后：联邦审批与身份衔接</text><text class="body" x="105" y="812">按证书期限提交永久居民申请；另行检查是否可以继续工作。</text><text class="body" x="40" y="947">规划示例通常跨3—5年以上；任何一个门槛失败都要暂停后续投入。</text></svg>