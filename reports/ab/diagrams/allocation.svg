<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-label="图2｜2026年度名额不是获批概率"><rect width="900" height="880" fill="#f5f6f1"/><style>text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#203f38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}</style><text class="title" x="40" y="49">图2｜2026年度名额不是获批概率</text><rect x="40" y="80" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="114" r="17" fill="#186d55"/><text x="74" y="120" text-anchor="middle" style="fill:white;font-size:17px">1</text><text class="head" x="105" y="120">年度省提名配额：6,603</text><text class="body" x="105" y="152">省官网2026年9月9日更新；本库9月24日核对。</text><path d="M450 192v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="212" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="246" r="17" fill="#186d55"/><text x="74" y="252" text-anchor="middle" style="fill:white;font-size:17px">2</text><text class="head" x="105" y="252">已发提名：4,864；剩余：1,739</text><text class="body" x="105" y="284">剩余空间会调整；不能理解为现在还能接受1,739个任意申请。</text><path d="M450 324v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="344" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="378" r="17" fill="#186d55"/><text x="74" y="384" text-anchor="middle" style="fill:white;font-size:17px">3</text><text class="head" x="105" y="384">待处理申请：1,238</text><text class="body" x="105" y="416">申请库存不是意向表达池，也不是全部最终获批人数。</text><path d="M450 456v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="476" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="510" r="17" fill="#186d55"/><text x="74" y="516" text-anchor="middle" style="fill:white;font-size:17px">4</text><text class="head" x="105" y="516">工人意向表达池：35,957</text><text class="body" x="105" y="548">不同类别竞争、职位、行业、地区、身份均影响选择。</text><path d="M450 588v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="608" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="642" r="17" fill="#186d55"/><text x="74" y="648" text-anchor="middle" style="fill:white;font-size:17px">5</text><text class="head" x="105" y="648">额外联邦空间：另列</text><text class="body" x="105" y="680">医生与法语人才全国额外安排，不可全部计作阿省固定配额。</text><text class="body" x="40" y="815">这是不同统计口径的顺序解释，不能相除推算个人成功率。</text></svg>