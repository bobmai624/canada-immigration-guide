<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1430" role="img" aria-labelledby="title desc"><title id="title">阿尔伯塔省：工人与企业家类别、专项通路及联邦衔接</title><desc id="desc">从阿尔伯塔优势移民计划分为四个工人主类别和四个企业家主类别。科技、执法及医疗快速通道属于省快速通道；医疗另有非快速通道选项。满足适用条件取得省提名后，联邦独立审批永久居民。横向类别为备选，不是连续办理。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55776e" stroke-width="1.5"/></marker></defs><rect width="1320" height="1430" fill="#fff"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#193e37"><text x="40" y="47" font-size="29" font-weight="700" text-anchor="start" fill="#193e37">图1｜阿尔伯塔省：两类入口、八个主类别与联邦衔接</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#62756d">沿分支向下阅读；同一排是不同选项，不是需要依次办理的步骤。</text><rect x="295" y="105" width="730" height="90" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="660.0" y="130.0" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">阿尔伯塔优势移民计划</text><text x="660.0" y="156.0" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">阿尔伯塔优势移民计划（Alberta Advantage Immigration Program，AAIP）</text><text x="660.0" y="182.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">省政府负责选择与提名；联邦决定最终永久居民身份</text><path d="M510 195 L405 228" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M810 195 L1045 228" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="230" width="710" height="75" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="405.0" y="260.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">工人类别（Streams for workers）</text><text x="405.0" y="286.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">按工作、雇主、经验、语言与职业资格选择</text><rect x="830" y="230" width="450" height="75" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1055.0" y="260.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">企业家类别（Streams for entrepreneurs）</text><text x="1055.0" y="286.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">按背景、资金、商业方案与实际经营选择</text><path d="M405 305 V318 H35 V392 H50" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M405 305 V318 H775 V392 H760" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M405 305 V318 H35 V542 H50" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M405 305 V318 H775 V542 H760" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1055 305 V318 H815 V392 H830" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1055 305 V318 H1295 V392 H1280" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1055 305 V318 H815 V542 H830" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1055 305 V318 H1295 V542 H1280" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="335" width="345" height="115" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="222.5" y="359.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">阿尔伯塔机会类别</text><text x="222.5" y="385.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">Alberta Opportunity Stream</text><text x="222.5" y="411.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">已在阿省持合格工签工作</text><text x="222.5" y="437.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">核学历、相关经验和雇主</text><rect x="415" y="335" width="345" height="115" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="587.5" y="359.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">阿尔伯塔快速通道类别</text><text x="587.5" y="385.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">Alberta Express Entry Stream</text><text x="587.5" y="411.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">先符合联邦快速通道资格</text><text x="587.5" y="437.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">再符合阿省选择条件</text><rect x="50" y="485" width="345" height="115" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="222.5" y="509.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">乡村振兴类别</text><text x="222.5" y="535.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">Rural Renewal Stream</text><text x="222.5" y="561.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">指定社区职位＋社区背书</text><text x="222.5" y="587.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">境内外申请的职业范围不同</text><rect x="415" y="485" width="345" height="115" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="587.5" y="509.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">旅游与酒店类别</text><text x="587.5" y="535.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">Tourism and Hospitality Stream</text><text x="587.5" y="561.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">指定工签＋合格行业/雇主</text><text x="587.5" y="587.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">同一雇主至少连续工作6个月</text><rect x="830" y="335" width="215" height="115" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="937.5" y="359.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">乡村企业家类别</text><text x="937.5" y="385.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Rural Entrepreneur</text><text x="937.5" y="411.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Stream</text><text x="937.5" y="437.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">社区支持＋真实经营</text><rect x="1065" y="335" width="215" height="115" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1172.5" y="359.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">毕业生企业家类别</text><text x="1172.5" y="385.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Graduate Entrepreneur</text><text x="1172.5" y="411.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Stream</text><text x="1172.5" y="437.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">阿省合格毕业生创业</text><rect x="830" y="485" width="215" height="115" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="937.5" y="509.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">海外毕业生企业家</text><text x="937.5" y="535.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Foreign Graduate</text><text x="937.5" y="561.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Entrepreneur Stream</text><text x="937.5" y="587.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">境外学位＋机构推荐</text><rect x="1065" y="485" width="215" height="115" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1172.5" y="509.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">农场类别</text><text x="1172.5" y="535.5" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Farm Stream</text><text x="1172.5" y="561.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">农业能力＋资金</text><text x="1172.5" y="587.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">初级农业生产投资</text><text x="50" y="641" font-size="21" font-weight="700" text-anchor="start" fill="#193e37">工人类别的专项通路：分清所属类别与联邦衔接</text><rect x="50" y="665" width="710" height="112" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="405.0" y="688.0" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">省快速通道内：科技、执法、医疗快速通道</text><text x="405.0" y="714.0" font-size="17" font-weight="400" text-anchor="middle" fill="#193e37">Accelerated Tech / Law Enforcement / Dedicated Health Care</text><text x="405.0" y="740.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">科技核职业与雇主行业；执法核指定招聘；医疗核专业执业能力</text><text x="405.0" y="766.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">它们是所属类别内的通路，不另计为三个主类别</text><path d="M587 450 V467 H405 V616 H780 V721 H760" stroke="#55776e" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="50" y="799" width="710" height="105" rx="12" fill="#f2f3f2" stroke="#bcc4bf"/><text x="405.0" y="818.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">医疗另有非快速通道选项</text><text x="405.0" y="844.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">Dedicated Health Care Pathway — Non-Express Entry</text><text x="405.0" y="870.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">只在不符合省快速通道且满足该选项条件时研究</text><text x="405.0" y="896.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">符合快速通道要求者须使用快速通道选项</text><text x="50" y="932" font-size="17" font-weight="400" text-anchor="start" fill="#62756d">两种医疗选项不可互相替代；专业、职位及监管要求另核。</text><path d="M1055 600 V655" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="830" y="660" width="450" height="137" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1055.0" y="695.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">三类企业家：按适用方案经营履约</text><text x="1055.0" y="721.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">意向表达 → 获邀 → 商业申请</text><text x="1055.0" y="747.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">按批准方案处理工作许可、经营和报告</text><text x="1055.0" y="773.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">已实际经营的合格申请人有不同时间规则</text><rect x="830" y="819" width="450" height="85" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1055.0" y="841.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">农场类别：按独立流程审查</text><text x="1055.0" y="867.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">农业经营能力、资金及商业可行性</text><text x="1055.0" y="893.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">不套用另外三类企业家的意向表达池</text><path d="M1172 600 V622 H1304 V861 H1280" stroke="#55776e" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="50" y="959" width="710" height="83" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="405.0" y="993.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">工人申请：满足资格 → 意向表达 → 获邀 → 完整申请</text><text x="405.0" y="1019.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">名额、分数和选择重点影响邀请；入池不保证提名</text><rect x="830" y="959" width="450" height="83" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1055.0" y="993.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">企业家申请：真实经营与适用条件核验</text><text x="1055.0" y="1019.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">完成对应类别审查后，才可能获得省提名</text><path d="M405 1042 V1073" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1055 1042 V1073" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="1075" width="710" height="104" rx="12" fill="#edf3fc" stroke="#a4b8d4"/><text x="405.0" y="1107.0" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">取得省提名：按所选类别衔接联邦</text><text x="405.0" y="1133.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">省快速通道提名 → 联邦快速通道程序</text><text x="405.0" y="1159.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">其他适用工人提名 → 联邦非快速通道省提名程序</text><rect x="830" y="1075" width="450" height="104" rx="12" fill="#fff6e5" stroke="#d8bd81"/><text x="1055.0" y="1107.0" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">取得省提名</text><text x="1055.0" y="1133.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">企业家类别衔接联邦</text><text x="1055.0" y="1159.0" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">非快速通道省提名程序</text><path d="M405 1179 V1200 H660 V1218" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1055 1179 V1200 H660 V1218" stroke="#55776e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="1220" width="1230" height="105" rx="12" fill="#ecf5ee" stroke="#a0bcaa"/><text x="665.0" y="1252.5" font-size="20" font-weight="650" text-anchor="middle" fill="#193e37">加拿大移民、难民及公民部独立审批永久居民申请</text><text x="665.0" y="1278.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">加拿大移民、难民及公民部（Immigration, Refugees and Citizenship Canada，IRCC）</text><text x="665.0" y="1304.5" font-size="18" font-weight="400" text-anchor="middle" fill="#193e37">省提名 ≠ 永久居民批准；入池、申请或提名都不会自动产生或延长工作权</text><text x="50" y="1360" font-size="18" font-weight="400" text-anchor="start" fill="#62756d">实线：主要分类与办理衔接　　虚线：专项说明；不代表新增独立主类别</text><text x="50" y="1392" font-size="17" font-weight="400" text-anchor="start" fill="#62756d">官方来源：阿省计划总览、专设医疗及各类别申请页｜核对：2026-09-24｜本库整理示意图</text></g></svg>