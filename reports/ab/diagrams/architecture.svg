<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-label="图1｜先理解政府怎样分工"><rect width="900" height="880" fill="#f5f6f1"/><style>text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#203f38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}</style><text class="title" x="40" y="49">图1｜先理解政府怎样分工</text><rect x="40" y="80" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="114" r="17" fill="#186d55"/><text x="74" y="120" text-anchor="middle" style="fill:white;font-size:17px">1</text><text class="head" x="105" y="120">联邦：决定工作许可和永久居民身份</text><text class="body" x="105" y="152">省提名不是签证，也不会自动赋予工作权。</text><path d="M450 192v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="212" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="246" r="17" fill="#186d55"/><text x="74" y="252" text-anchor="middle" style="fill:white;font-size:17px">2</text><text class="head" x="105" y="252">省政府：八个经济移民主类别</text><text class="body" x="105" y="284">四个工人类别、四个企业家类别；不是八种入境签证。</text><path d="M450 324v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="344" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="378" r="17" fill="#186d55"/><text x="74" y="384" text-anchor="middle" style="fill:white;font-size:17px">3</text><text class="head" x="105" y="384">细分通路：属于已有类别</text><text class="body" x="105" y="416">科技、执法、医疗衔接必须放回所属类别核资格。</text><path d="M450 456v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="476" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="510" r="17" fill="#186d55"/><text x="74" y="516" text-anchor="middle" style="fill:white;font-size:17px">4</text><text class="head" x="105" y="516">选择机制：合格只是进入候选范围</text><text class="body" x="105" y="548">工人意向表达、邀请与容量限制，再进入完整审核。</text><path d="M450 588v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="608" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="642" r="17" fill="#186d55"/><text x="74" y="648" text-anchor="middle" style="fill:white;font-size:17px">5</text><text class="head" x="105" y="648">实际履约和联邦审批</text><text class="body" x="105" y="680">工人持续满足工作与身份条件；企业家先经营再提名。</text><text class="body" x="40" y="815">联邦、省、社区和监管机构分别把关；一张名单不能代替完整申请。</text></svg>