<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-label="图5｜工作权要独立检查"><rect width="900" height="880" fill="#f5f6f1"/><style>text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#203f38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}</style><text class="title" x="40" y="49">图5｜工作权要独立检查</text><rect x="40" y="80" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="114" r="17" fill="#186d55"/><text x="74" y="120" text-anchor="middle" style="fill:white;font-size:17px">1</text><text class="head" x="105" y="120">人在境外＋真实雇主职位</text><text class="body" x="105" y="152">先判断雇主能否提供劳动力市场评估或适用豁免依据。</text><path d="M450 192v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="212" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="246" r="17" fill="#186d55"/><text x="74" y="252" text-anchor="middle" style="fill:white;font-size:17px">2</text><text class="head" x="105" y="252">人在加拿大读书</text><text class="body" x="105" y="284">学签工作权限有限；正常在读工作不自动变成合格移民工作经验。</text><path d="M450 324v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="344" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="378" r="17" fill="#186d55"/><text x="74" y="384" text-anchor="middle" style="fill:white;font-size:17px">3</text><text class="head" x="105" y="384">毕业后申请工作许可</text><text class="body" x="105" y="416">课程与个人资格、申请期限、护照效期一起决定结果。</text><path d="M450 456v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="476" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="510" r="17" fill="#186d55"/><text x="74" y="516" text-anchor="middle" style="fill:white;font-size:17px">4</text><text class="head" x="105" y="516">工签将到期但仍在候选池</text><text class="body" x="105" y="548">入池、邀请或省申请收件本身都不会自动延长工作权。</text><path d="M450 588v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="608" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="642" r="17" fill="#186d55"/><text x="74" y="648" text-anchor="middle" style="fill:white;font-size:17px">5</text><text class="head" x="105" y="648">取得提名或递交永久居民申请</text><text class="body" x="105" y="680">分别核省支持信、雇主专属工签或过渡开放工签；由联邦批准。</text><text class="body" x="40" y="815">图中是不同身份情形的检查顺序，不是每人都依次办理的五张签证。</text></svg>