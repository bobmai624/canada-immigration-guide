<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-label="图3｜工人评分只是一个筛选维度"><rect width="900" height="880" fill="#f5f6f1"/><style>text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#203f38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}</style><text class="title" x="40" y="49">图3｜工人评分只是一个筛选维度</text><rect x="40" y="80" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="114" r="17" fill="#186d55"/><text x="74" y="120" text-anchor="middle" style="fill:white;font-size:17px">1</text><text class="head" x="105" y="120">先过硬门槛</text><text class="body" x="105" y="152">工签、工作、职业、语言和雇主条件先分别核实。</text><path d="M450 192v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="212" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="246" r="17" fill="#186d55"/><text x="74" y="252" text-anchor="middle" style="fill:white;font-size:17px">2</text><text class="head" x="105" y="252">个人因素最高69分</text><text class="body" x="105" y="284">学历22＋语言13＋经历21＋年龄5＋家庭联系8。</text><path d="M450 324v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="344" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="378" r="17" fill="#186d55"/><text x="74" y="384" text-anchor="middle" style="fill:white;font-size:17px">3</text><text class="head" x="105" y="384">经济因素最高31分</text><text class="body" x="105" y="416">职位16＋地点5＋受监管职业资格10。</text><path d="M450 456v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="476" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="510" r="17" fill="#186d55"/><text x="74" y="516" text-anchor="middle" style="fill:white;font-size:17px">4</text><text class="head" x="105" y="516">省政府按重点进行邀请</text><text class="body" x="105" y="548">未计分的职业、行业、身份也可用于筛选。</text><path d="M450 588v17m-5-5 5 5 5-5" stroke="#186d55" fill="none"/><rect x="40" y="608" width="820" height="110" rx="12" fill="white" stroke="#ccdbd0"/><circle cx="74" cy="642" r="17" fill="#186d55"/><text x="74" y="648" text-anchor="middle" style="fill:white;font-size:17px">5</text><text class="head" x="105" y="648">获邀之后提交真实证据</text><text class="body" x="105" y="680">自报分数与实际不符，可被拒绝；高分不保证获邀。</text><text class="body" x="40" y="815">评分表版本：2025年8月7日；本轮核对的官方现行下载。</text></svg>